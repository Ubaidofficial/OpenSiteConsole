# Weekly pull requests for dependency and workflow updates. Each one runs the CI workflow, so a bad update shows as a red check.
# Minor and patch updates are grouped into one pull request per ecosystem to keep the noise down; major updates come separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
