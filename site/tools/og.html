<!doctype html>
<!-- The link-preview image (site/assets/og.png, 1200 x 630). Rebuild with: node site/tools/render-og.cjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter Variable'; src: url('../assets/fonts/inter-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Inter Variable', sans-serif; color: #0d0d0f; position: relative;
    background: radial-gradient(60% 70% at 85% 10%, rgba(198, 255, 74, 0.35), transparent 70%),
      linear-gradient(rgba(13,13,15,0.06) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, rgba(13,13,15,0.06) 1px, transparent 1px) 0 0 / 80px 80px, #fafaf9; }
  .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -0.03em; }
  .brand img { width: 48px; height: 48px; border-radius: 11px; }
  h1 { margin: 34px 0 0; font-size: 70px; line-height: 0.98; letter-spacing: -0.055em; font-weight: 750; }
  .hl { background: linear-gradient(transparent 58%, #c6ff4a 58%, #c6ff4a 96%, transparent 96%); }
  .chips { position: absolute; left: 72px; bottom: 62px; display: flex; flex-wrap: wrap; gap: 10px; width: 560px; }
  .chip { display: inline-flex; align-items: center; gap: 9px; background: #fff; border: 1.5px solid rgba(13,13,15,0.18); border-radius: 999px; padding: 9px 16px 9px 12px; font-size: 19px; font-weight: 600; }
  .chip img { width: 22px; height: 22px; object-fit: contain; }
  .chip.oss { background: #0d0d0f; color: #fff; border-color: #0d0d0f; padding-left: 16px; }
  .shot { position: absolute; left: 690px; top: 92px; width: 760px; border-radius: 16px; border: 1.5px solid #0d0d0f; overflow: hidden; background: #fff; box-shadow: 10px 10px 0 #0d0d0f; }
  .shot .bar { height: 30px; background: #f1f1ee; border-bottom: 1px solid rgba(13,13,15,0.12); display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; background: rgba(13,13,15,0.18); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../assets/brand/mark-dark.svg" alt="">SEOConsole</div>
    <h1>Find <span class="hl">hidden</span> SEO opportunities across all your websites.</h1>
  </div>
  <div class="chips">
    <span class="chip"><img src="../assets/logos/search-console.svg" alt="">Google Search Console</span>
    <span class="chip"><img src="../assets/logos/bing.svg" alt="">Bing</span>
    <span class="chip"><img src="../assets/logos/ga4.svg" alt="">GA4</span>
    <span class="chip"><img src="../assets/logos/clarity.png" alt="">Clarity</span>
    <span class="chip"><img src="../assets/logos/mcp.svg" alt="">MCP</span>
    <span class="chip oss">Free · open source</span>
  </div>
  <div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../assets/shots/dashboard-1600.webp" alt=""></div>
</body>
</html>
