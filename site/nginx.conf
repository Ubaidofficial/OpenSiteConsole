server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 512;

    include /etc/nginx/security-headers.conf;

    # One day: screenshots and logos are replaced under the same name when the page is redesigned. The stylesheet and script are
    # linked with ?v=<hash of the file> (checked by tests/site.test.ts), so a new version is fetched as soon as index.html changes.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
