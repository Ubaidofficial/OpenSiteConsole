<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<title>SEOConsole</title>
		<script nonce="%sveltekit.nonce%">
			// Apply privacy mode before first paint so site names never flash on screen.
			try {
				if (localStorage.getItem('osc_privacy') === '1') document.documentElement.dataset.privacy = 'on';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
